[package]
name = "simrscb-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", default-features = false, features = ["mysql", "runtime-tokio-rustls", "chrono", "macros", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
tower-http = { version = "0.5", features = ["cors", "set-header"] }
dotenvy = "0.15"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.21"
captcha = "0.0.9"
rand = "0.8"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"
# BPJS VClaim response decompression (port dari Khanza ApiBPJSLZString.java)
lz-str = "0.2"
percent-encoding = "2.3"
bcrypt = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
